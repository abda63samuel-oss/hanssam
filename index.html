<!doctype html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공유 문서</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
    body { max-width: 720px; margin: 0 auto; padding: 4rem 1.25rem; color: #1f2937; line-height: 1.7; }

    <strong>배포 방법:</strong> 새 HTML 파일을 이 저장소에 올리고 <code>main</code> 브랜치에 푸시하면 자동으로 공개됩니다.
  </div>
</body>
</html>
